<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #12100e;
  --bg-dark: #1a1815;
  --bg-card: #221f1a;
  --bg-card-hover: #2a2620;
  --border: #3a3530;
  --border-light: #4a4238;
  --text: #d4c8b0;
  --text-dim: #8a7e6a;
  --text-bright: #f0e6cc;
  --pumpkin: #d4843e;
  --pumpkin-glow: #e8a04c;
  --pumpkin-deep: #b8602a;
  --green-candle: #4a8a4a;
  --green-bright: #6aaa5a;
  --red-candle: #c44b3f;
  --cream: #e8d5a8;
}

body {
  font-family: 'Space Mono', monospace;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-dark);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--text-bright);
}

.header h1 span {
  font-family: 'Nosifer', cursive;
  color: var(--pumpkin);
  font-size: 16px;
}

.back-btn {
  color: var(--pumpkin);
  text-decoration: none;
  font-size: 14px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: all 0.2s;
}

.back-btn:hover {
  background: var(--bg-card);
  border-color: var(--pumpkin);
}

/* Stats bar */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 16px 20px;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border);
}

.stat {
  text-align: center;
}

.stat-num {
  font-family: 'Noto Serif JP', serif;
  font-size: 28px;
  font-weight: 900;
  color: var(--pumpkin-glow);
}

.stat-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-dim);
}

.progress-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 12px 20px;
}

.progress-track {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(
    90deg, var(--pumpkin-deep), var(--pumpkin-glow));
  border-radius: 2px;
  transition: width 0.4s ease;
}

.pace-info {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
}

/* Filters */
.filters {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  flex-wrap: wrap;
}

.filter-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 14px;
  border-radius: 16px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  transition: all 0.2s;
}

.filter-btn:hover {
  border-color: var(--pumpkin);
  color: var(--text);
}

.filter-btn.active {
  background: var(--pumpkin);
  color: #12100e;
  border-color: var(--pumpkin);
  font-weight: 700;
}

/* Sections */
.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 0 16px;
}

.section {
  margin-top: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border);
}

.section-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--cream);
}

.section-count {
  font-size: 11px;
  color: var(--text-dim);
  background: rgba(212,132,62,0.15);
  padding: 2px 10px;
  border-radius: 10px;
}

.ticker-list {
  list-style: none;
  padding: 6px 0;
}

.ticker-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid rgba(58,53,48,0.5);
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}

.ticker-item:last-child { border-bottom: none; }

.ticker-item:hover {
  background: var(--bg-card-hover);
}

.ticker-item.checked {
  opacity: 0.45;
}

.ticker-item.checked .ticker-symbol {
  text-decoration: line-through;
}

.ticker-item.checked .check-box {
  background: var(--green-candle);
  border-color: var(--green-bright);
}

.ticker-item.checked .check-box::after {
  content: '\2713';
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}

.check-box {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border-light);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.ticker-symbol {
  font-weight: 700;
  color: var(--pumpkin-glow);
  min-width: 60px;
  font-size: 14px;
}

.ticker-name {
  color: var(--text);
  font-size: 12px;
  flex: 1;
}

.ticker-type {
  font-size: 10px;
  color: var(--text-dim);
  background: var(--bg-dark);
  padding: 2px 8px;
  border-radius: 8px;
  flex-shrink: 0;
}

/* Hide checked items filter */
.hide-checked .ticker-item.checked {
  display: none;
}

@media (max-width: 768px) {
  .header h1 { font-size: 16px; }
  .stats-bar { gap: 20px; }
  .stat-num { font-size: 22px; }
  .ticker-item { padding: 10px 14px; }
  .ticker-name { font-size: 11px; }
}

  TICKERS.forEach(c => n += c.items.length);

  const remain = total - done;
  document.getElementById('checkedCount')
    .textContent = done;
  document.getElementById('remainCount')
    .textContent = remain;
  document.getElementById('weeksLeft')
    .textContent = Math.ceil(remain / 2);
  const pct = (done / total * 100).toFixed(1);
  document.getElementById('progressFill')
    .style.width = pct + '%';
  document.getElementById('paceInfo')
    .textContent = `${pct}% complete \u2014 `
    + `${Math.ceil(remain / 2)} weeks at 2/week`;

  // Update section counts
  document.querySelectorAll('.section').forEach(sec => {
    const cat = sec.dataset.cat;
    const catData = TICKERS.find(c => c.cat === cat);
    if (!catData) return;
    const catDone = catData.items
      .filter(i => checked[i.s]).length;
    const badge = sec.querySelector('.section-count');
    if (badge) badge.textContent =
      catDone + ' / ' + catData.items.length;
  });
}

function render() {
  const container =
    document.getElementById('listContainer');
  container.innerHTML = '';

  TICKERS.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.dataset.cat = cat.cat;

    const catDone = cat.items
      .filter(i => checked[i.s]).length;

    sec.innerHTML = `
      <div class="section-header">
        <div class="section-title">${cat.cat}</div>
        <div class="section-count">
          ${catDone} / ${cat.items.length}</div>
      </div>
      <ul class="ticker-list"></ul>
    `;

    const ul = sec.querySelector('.ticker-list');

    cat.items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'ticker-item'
        + (checked[item.s] ? ' checked' : '');
      li.dataset.symbol = item.s;
      li.innerHTML = `
        <div class="check-box"></div>
        <div class="ticker-symbol">${item.s}</div>
        <div class="ticker-name">${item.n}</div>
        <div class="ticker-type">${item.t}</div>
      `;
      li.addEventListener('click', () => {
        checked[item.s] = !checked[item.s];
        if (!checked[item.s]) delete checked[item.s];
        li.classList.toggle('checked');
        save();
        updateStats();
        applyFilter();
      });
      ul.appendChild(li);
    });

    container.appendChild(sec);
  });

  updateStats();
}

// Filters
let currentFilter = 'all';

function applyFilter() {
  const items =
    document.querySelectorAll('.ticker-item');
  items.forEach(li => {
    const isChecked =
      li.classList.contains('checked');
    if (currentFilter === 'all') {
      li.style.display = '';
    } else if (currentFilter === 'unchecked') {
      li.style.display = isChecked ? 'none' : '';
    } else if (currentFilter === 'checked') {
      li.style.display = isChecked ? '' : 'none';
    }
  });

  // Hide empty sections
  document.querySelectorAll('.section').forEach(sec => {
    const visible = sec.querySelectorAll(
      '.ticker-item:not([style*="display: none"])');
    sec.style.display =
      visible.length === 0 ? 'none' : '';
  });
}

document.querySelectorAll('.filter-btn')
  .forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn')
      .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.f;
    applyFilter();
  });
});

render();
</script>
</body>
</html>
