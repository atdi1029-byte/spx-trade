<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro DSS Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0F0F1A; color: #d4c9b8;
  font-family: 'Space Mono', monospace;
  padding: 20px; min-height: 100vh;
}
h1 { font-size: 1.4rem; color: #e8dcc8; margin-bottom: 4px; }
.subtitle { font-size: 0.75rem; color: #888; margin-bottom: 24px; }

/* Section headers */
.section-header {
  font-size: 1.1rem; font-weight: 700; margin: 28px 0 12px;
  padding-bottom: 6px; border-bottom: 1px solid #333;
  display: flex; align-items: baseline; gap: 12px;
}
.section-header .val { font-size: 1.3rem; }
.section-header .date { font-size: 0.7rem; color: #666; }

/* Info table */
.info-table {
  border-collapse: collapse; margin-bottom: 16px; font-size: 0.75rem;
}
.info-table th {
  color: #888; font-weight: 400; padding: 3px 10px;
  text-align: center; background: #0F0F1A; border: 1px solid #444;
}
.info-table td {
  padding: 4px 10px; text-align: center;
  border: 1px solid #444; background: #1A1A2E;
}
.info-table .tf-label { font-weight: 700; }

.zb-ob   { background: rgba(255,23,68,0.4) !important; color: #fff; }
.zb-high { background: rgba(255,152,0,0.25) !important; color: #fff; }
.zb-os   { background: rgba(0,230,118,0.4) !important; color: #fff; }
.zb-low  { background: rgba(0,188,212,0.25) !important; color: #fff; }
.zb-mid  { background: rgba(51,51,51,0.5) !important; color: #fff; }
.zc-ob  { color: #FF1744; }
.zc-os  { color: #00E676; }
.zc-mid { color: #888; }
.trend-up   { color: #00E676; font-weight: 700; }
.trend-down { color: #FF1744; font-weight: 700; }

/* Charts */
.chart-section {
  background: #1A1A2E; border: 1px solid #333;
  border-radius: 8px; padding: 12px 16px; margin-bottom: 12px;
}
.chart-section.composite { border: 1px solid #555; }
.chart-header {
  font-size: 0.8rem; color: #888; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.chart-header .tf { font-weight: 700; }
.chart-header .data-src { font-size: 0.6rem; color: #555; margin-left: auto; }
.chart-wrap { position: relative; height: 280px; overflow-x: auto; overflow-y: hidden; }
.chart-wrap canvas { height: 100%; cursor: crosshair; }

.chart-tooltip {
  position: absolute; background: rgba(15,15,26,0.92);
  border: 1px solid #444; border-radius: 4px;
  padding: 6px 10px; font-size: 0.72rem; color: #e8dcc8;
  pointer-events: none; white-space: nowrap; display: none; z-index: 10;
}

.loading { color: #666; font-size: 0.85rem; padding: 40px; text-align: center; }

</style>
</head>
<body>

<h1>Liquidity DSS Dashboard</h1>
<p class="subtitle">Net Liquidity (3-Day + Monthly) + TGA (3-Day) — DSS Bressert with Signal + Tide</p>
<div id="content">
  <div class="loading">Fetching macro data...</div>
</div>

<script>
const BASE = 'https://script.google.com/macros/s/AKfycbyeL8nGHmsRRG2uk7I3cuh2aWQ14RRKvJYwOblvOWw36_QIKyr9KaA4jXK1K5pyySNiBg/exec';
const TREASURY_API = 'https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/dts/operating_cash_balance?fields=record_date,open_today_bal&filter=account_type:eq:Treasury%20General%20Account%20(TGA)%20Closing%20Balance,record_date:gte:2024-09-01&sort=record_date&page%5Bsize%5D=600';

const WT_D = 20, WT_3D = 50, WT_W = 30;
const COMP_SMOOTH = 15, SIG_SMOOTH = 5, TREND_LEN = 30, TREND_BARS = 3;

// ─── DSS Bressert ───
function calcDSS(values, stochLen, smoothLen) {
  const len = values.length, rawK = [];
  for (let i = 0; i < len; i++) {
    if (i < stochLen - 1) { rawK.push(null); continue; }
    let hi = -Infinity, lo = Infinity;
    for (let j = i - stochLen + 1; j <= i; j++) {
      if (values[j] > hi) hi = values[j];
      if (values[j] < lo) lo = values[j];
    }
    const r = hi - lo;
    rawK.push(r === 0 ? 50 : ((values[i] - lo) / r) * 100);
  }
  const s1 = ema(rawK, smoothLen), rawK2 = [];
  for (let i = 0; i < len; i++) {
    if (s1[i] === null || i < stochLen - 1) { rawK2.push(null); continue; }
    let hi = -Infinity, lo = Infinity, ok = true;
    for (let j = i - stochLen + 1; j <= i; j++) {
      if (s1[j] === null) { ok = false; break; }
      if (s1[j] > hi) hi = s1[j];
      if (s1[j] < lo) lo = s1[j];
    }
    if (!ok) { rawK2.push(null); continue; }
    const r = hi - lo;
    rawK2.push(r === 0 ? 50 : ((s1[i] - lo) / r) * 100);
  }
  return ema(rawK2, smoothLen);
}

function ema(arr, p) {
  const out = [], k = 2 / (p + 1); let prev = null;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === null) { out.push(null); continue; }
    prev = prev === null ? arr[i] : arr[i] * k + prev * (1 - k);
    out.push(prev);
  }
  return out;
}

function resample(series, days) {
  if (days <= 1) return series;
  const bars = [];
  for (let i = 0; i < series.length; i += days) {
    const chunk = series.slice(i, i + days);
    bars.push(chunk[chunk.length - 1]);
  }
  return bars;
}

function alignToDaily(dDates, tfDss, tfDates) {
  const aligned = []; let idx = 0, last = null;
  for (let i = 0; i < dDates.length; i++) {
    while (idx < tfDates.length - 1 && tfDates[idx + 1] <= dDates[i]) idx++;
    if (tfDates[idx] <= dDates[i] && tfDss[idx] !== null) last = tfDss[idx];
    aligned.push(last);
  }
  return aligned;
}

// ─── Zone helpers ───
const OB = 80, OS = 20;
function zoneLabel(v) { if (v===null) return '—'; if (v>OB) return 'OB'; if (v<OS) return 'OS'; if (v>65) return 'HIGH'; if (v<35) return 'LOW'; return '—'; }
function zoneLabelClass(v) { if (v===null) return 'zc-mid'; return v>OB?'zc-ob':v<OS?'zc-os':'zc-mid'; }
function zoneBgClass(v) { if (v===null) return 'zb-mid'; if (v>OB) return 'zb-ob'; if (v>65) return 'zb-high'; if (v<OS) return 'zb-os'; if (v<35) return 'zb-low'; return 'zb-mid'; }
function zoneColor(v) { if (v>OB) return '#FF1744'; if (v<OS) return '#00E676'; if (v>65) return '#FF9800'; if (v<35) return '#00BCD4'; return '#888'; }
function compColor(v) { if (v===null) return '#888'; return v<50?lerpColor('#00E676','#FFD700',Math.max(0,Math.min(1,(v-OS)/(50-OS)))):lerpColor('#FFD700','#FF1744',Math.max(0,Math.min(1,(v-50)/(OB-50)))); }
function lerpColor(a,b,t) { const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)]; const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)]; return '#'+[0,1,2].map(i=>Math.round(pa[i]+(pb[i]-pa[i])*t).toString(16).padStart(2,'0')).join(''); }
function trendArrow(c,p) { if (c===null||p===null) return ['—','zc-mid']; return c>p?[' ▲','trend-up']:[' ▼','trend-down']; }

const TF_COLORS = { D:'#00BCD4', '3D':'#FF9800', W:'#BB86FC', M:'#E91E63', COMP:'#FFD700' };
const chartStates = {};

// ─── Chart drawing ───
function drawChart(id, vals, dates, tfKey, maxPts) {
  const c = document.getElementById(id); if (!c) return;
  const dpr = window.devicePixelRatio||1;
  const r = c.parentElement.getBoundingClientRect();
  c.width = r.width*dpr; c.height = r.height*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const w = r.width, h = r.height;
  const pad = {top:10,right:45,bottom:22,left:38};
  const pw = w-pad.left-pad.right, ph = h-pad.top-pad.bottom;
  const pts = []; for (let i=0;i<vals.length;i++) if(vals[i]!==null) pts.push({v:vals[i],d:dates[i]});
  if (pts.length<2) return;
  const disp = pts.slice(-maxPts);
  chartStates[id] = {display:disp,pad,w,h,pw,ph,tfKey};
  const toX = i => pad.left+(i/(disp.length-1))*pw;
  const toY = v => pad.top+ph*(1-Math.max(0,Math.min(100,v))/100);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,pad,pw,ph,toX,toY,disp);
  const lc = TF_COLORS[tfKey]||'#00BCD4';
  ctx.beginPath();
  for (let i=0;i<disp.length;i++) { const x=toX(i),y=toY(disp[i].v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.strokeStyle=lc; ctx.lineWidth=tfKey==='D'?3:2; ctx.stroke();
  // Fill
  ctx.beginPath();
  for (let i=0;i<disp.length;i++){const x=toX(i),y=toY(disp[i].v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.lineTo(toX(disp.length-1),h-pad.bottom); ctx.lineTo(pad.left,h-pad.bottom); ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom); g.addColorStop(0,lc+'18'); g.addColorStop(1,lc+'03');
  ctx.fillStyle=g; ctx.fill();
  const last=disp[disp.length-1];
  ctx.beginPath(); ctx.arc(toX(disp.length-1),toY(last.v),4,0,Math.PI*2); ctx.fillStyle=lc; ctx.fill();
  ctx.fillStyle='#e8dcc8'; ctx.font='10px "Space Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(last.v.toFixed(1),w-pad.right+6,toY(last.v)+4);
}

function drawComposite(id, comp, sig, trend, dates, maxPts) {
  const c = document.getElementById(id); if (!c) return;
  const dpr = window.devicePixelRatio||1;
  const container = c.parentElement;
  const containerW = container.getBoundingClientRect().width;
  const h = container.getBoundingClientRect().height;

  // Collect valid points first to determine width
  const pts = [];
  for (let i=0;i<comp.length;i++) if(comp[i]!==null&&sig[i]!==null) pts.push({v:comp[i],s:sig[i],t:trend[i],d:dates[i]});
  if (pts.length<2) return;
  const disp = pts.slice(-maxPts);

  // 6px per data point, minimum container width
  const pxPerPt = 6;
  const w = Math.max(containerW, disp.length * pxPerPt + 83);
  c.width = w*dpr; c.height = h*dpr;
  c.style.width = w + 'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const pad = {top:10,right:45,bottom:22,left:38};
  const pw = w-pad.left-pad.right, ph = h-pad.top-pad.bottom;
  chartStates[id] = {display:disp,pad,w,h,pw,ph,tfKey:'COMP',isComposite:true};
  const toX = i => pad.left+(i/(disp.length-1))*pw;
  const toY = v => pad.top+ph*(1-Math.max(0,Math.min(100,v))/100);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,pad,pw,ph,toX,toY,disp);
  // Fill between comp & sig
  for (let i=1;i<disp.length;i++){
    const x0=toX(i-1),x1=toX(i);
    ctx.beginPath(); ctx.moveTo(x0,toY(disp[i-1].v)); ctx.lineTo(x1,toY(disp[i].v));
    ctx.lineTo(x1,toY(disp[i].s)); ctx.lineTo(x0,toY(disp[i-1].s)); ctx.closePath();
    ctx.fillStyle=(disp[i-1].v+disp[i].v)/2>(disp[i-1].s+disp[i].s)/2?'rgba(0,230,118,0.12)':'rgba(255,23,68,0.10)';
    ctx.fill();
  }
  // Trend EMA — segment by segment, green when rising, red when falling
  ctx.setLineDash([6,3]); ctx.lineWidth=2;
  for (let i=1;i<disp.length;i++){
    if(disp[i].t===null||disp[i-1].t===null) continue;
    ctx.beginPath();
    ctx.moveTo(toX(i-1),toY(disp[i-1].t));
    ctx.lineTo(toX(i),toY(disp[i].t));
    ctx.strokeStyle = disp[i].t > disp[i-1].t ? 'rgba(0,230,118,0.45)' : 'rgba(255,23,68,0.45)';
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // Signal line
  ctx.beginPath();
  for(let i=0;i<disp.length;i++){const x=toX(i),y=toY(disp[i].s);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.strokeStyle='rgba(136,136,136,0.5)';ctx.lineWidth=1;ctx.stroke();
  // Composite gradient line
  for(let i=1;i<disp.length;i++){ctx.beginPath();ctx.moveTo(toX(i-1),toY(disp[i-1].v));ctx.lineTo(toX(i),toY(disp[i].v));
  ctx.strokeStyle=compColor((disp[i-1].v+disp[i].v)/2);ctx.lineWidth=3;ctx.stroke();}
  // End dots
  const last=disp[disp.length-1];
  ctx.beginPath();ctx.arc(toX(disp.length-1),toY(last.v),5,0,Math.PI*2);ctx.fillStyle=compColor(last.v);ctx.fill();
  ctx.beginPath();ctx.arc(toX(disp.length-1),toY(last.s),3,0,Math.PI*2);ctx.fillStyle='#888';ctx.fill();
  ctx.font='10px "Space Mono",monospace';ctx.textAlign='left';
  ctx.fillStyle=compColor(last.v);ctx.fillText(last.v.toFixed(1),w-pad.right+6,toY(last.v)+4);
  ctx.fillStyle='#888';ctx.fillText(last.s.toFixed(1),w-pad.right+6,toY(last.s)+4);
}

function drawGrid(ctx,w,h,pad,pw,ph,toX,toY,disp) {
  ctx.fillStyle='rgba(255,23,68,0.08)';ctx.fillRect(pad.left,toY(100),pw,toY(OB)-toY(100));
  ctx.fillStyle='rgba(0,230,118,0.08)';ctx.fillRect(pad.left,toY(OS),pw,toY(0)-toY(OS));
  [0,OS,50,OB,100].forEach(lv=>{const y=toY(lv);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);
  if(lv===OB){ctx.strokeStyle='rgba(255,23,68,0.35)';ctx.setLineDash([5,4]);}
  else if(lv===OS){ctx.strokeStyle='rgba(0,230,118,0.35)';ctx.setLineDash([5,4]);}
  else if(lv===50){ctx.strokeStyle='rgba(102,102,102,0.4)';ctx.setLineDash([3,5]);}
  else{ctx.strokeStyle='rgba(68,68,68,0.25)';ctx.setLineDash([]);}
  ctx.lineWidth=0.8;ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#666';ctx.font='9px "Space Mono",monospace';ctx.textAlign='right';ctx.fillText(lv,pad.left-5,y+3);});
  ctx.fillStyle='#555';ctx.font='8px "Space Mono",monospace';ctx.textAlign='center';
  const n=Math.min(7,disp.length);
  for(let i=0;i<n;i++){const idx=Math.floor(i*(disp.length-1)/(n-1));const d=disp[idx].d;
  if(d){const p=d.split('-');ctx.fillText(p[0].slice(2)+'-'+p[1]+'-'+p[2],toX(idx),h-4);}}
}

// ─── Tooltip ───
function drawCrosshair(id, mx) {
  const st = chartStates[id]; if(!st) return;
  const {display:disp,pad,w,h,pw,ph,tfKey,isComposite}=st;
  const c=document.getElementById(id),tt=document.getElementById('tt-'+id);
  if(!c||!tt)return;
  const rx=mx-pad.left; if(rx<0||rx>pw){tt.style.display='none';return;}
  const idx=Math.max(0,Math.min(disp.length-1,Math.round((rx/pw)*(disp.length-1))));
  const pt=disp[idx];
  const toX=i=>pad.left+(i/(disp.length-1))*pw;
  const toY=v=>pad.top+ph*(1-Math.max(0,Math.min(100,v))/100);
  const px=toX(idx),py=toY(pt.v);
  if(isComposite)drawComposite(id,disp.map(p=>p.v),disp.map(p=>p.s),disp.map(p=>p.t),disp.map(p=>p.d),disp.length);
  else drawChart(id,disp.map(p=>p.v),disp.map(p=>p.d),tfKey,disp.length);
  const ctx=c.getContext('2d');
  ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(px,pad.top);ctx.lineTo(px,h-pad.bottom);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad.left,py);ctx.lineTo(w-pad.right,py);ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fillStyle=isComposite?compColor(pt.v):TF_COLORS[tfKey];ctx.fill();
  const zl=zoneLabel(pt.v),zc=zoneColor(pt.v);
  let html=`<div style="color:#888">${pt.d}</div><div style="color:${isComposite?compColor(pt.v):zc};font-weight:700">${pt.v.toFixed(1)}</div><div style="color:${zc};font-size:0.65rem">${zl}</div>`;
  if(isComposite&&pt.s!==undefined)html+=`<div style="color:#888;font-size:0.6rem">sig: ${pt.s.toFixed(1)}</div>`;
  tt.innerHTML=html;tt.style.display='block';
  let tl=px+12;if(tl+130>pw+pad.left+pad.right)tl=px-130;
  tt.style.left=tl+'px';tt.style.top=Math.max(0,py-40)+'px';
}

function setupTT(id) {
  const c=document.getElementById(id);if(!c)return;
  const tt=document.createElement('div');tt.className='chart-tooltip';tt.id='tt-'+id;
  c.parentElement.appendChild(tt);
  const gx=e=>{const r=c.getBoundingClientRect();return(e.touches?e.touches[0].clientX:e.clientX)-r.left;};
  c.addEventListener('mousemove',e=>drawCrosshair(id,gx(e)));
  c.addEventListener('touchmove',e=>{e.preventDefault();drawCrosshair(id,gx(e));},{passive:false});
  const cl=()=>{const s=chartStates[id];if(!s)return;
  if(s.isComposite)drawComposite(id,s.display.map(p=>p.v),s.display.map(p=>p.s),s.display.map(p=>p.t),s.display.map(p=>p.d),s.display.length);
  else drawChart(id,s.display.map(p=>p.v),s.display.map(p=>p.d),s.tfKey,s.display.length);tt.style.display='none';};
  c.addEventListener('mouseleave',cl);c.addEventListener('touchend',cl);
}

// ─── Interpolate weekly to daily (linear) ───
function interpolateToDaily(series, valKey) {
  if (series.length < 2) return series;
  const daily = [];
  for (let i = 0; i < series.length - 1; i++) {
    const d0 = new Date(series[i].date), d1 = new Date(series[i+1].date);
    const v0 = series[i][valKey], v1 = series[i+1][valKey];
    const days = Math.round((d1 - d0) / 86400000);
    for (let d = 0; d < days; d++) {
      const dt = new Date(d0.getTime() + d * 86400000);
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth()+1).padStart(2,'0');
      const dd = String(dt.getDate()).padStart(2,'0');
      const obj = { date: yyyy+'-'+mm+'-'+dd };
      obj[valKey] = v0 + (v1 - v0) * (d / days);
      daily.push(obj);
    }
  }
  // Add last point
  daily.push(series[series.length - 1]);
  return daily;
}

// ─── Process a data source — 3-day and monthly DSS ───
function processDSS(series, valKey, srcType) {
  // For weekly sources, interpolate to daily first for 3-day chart
  const dailySeries = srcType === 'weekly' ? interpolateToDaily(series, valKey) : series;

  // 3-day: resample interpolated daily by 3
  const s3 = resample(dailySeries, 3);
  const raw3 = calcDSS(s3.map(d => d[valKey]), 13, 8);
  const sig3 = ema(raw3, SIG_SMOOTH);
  const trend3 = ema(raw3, TREND_LEN);
  const d3 = s3.map(d => d.date);

  // Monthly: resample by 4 weeks or 20 days
  const sM = resample(series, srcType === 'weekly' ? 4 : 20);
  const rawM = calcDSS(sM.map(d => d[valKey]), 13, 8);
  const sigM = ema(rawM, SIG_SMOOTH);
  const trendM = ema(rawM, TREND_LEN);
  const dM = sM.map(d => d.date);

  return { raw3, sig3, trend3, d3, s3, rawM, sigM, trendM, dM, sM };
}

// ─── Build section HTML ───
function buildSection(prefix, label, color, data, nDaily, srcType) {
  const fv = v => v !== null ? v.toFixed(1) : '—';
  const last = (a) => a[a.length-1];
  const prev = (a) => a.length>1 ? a[a.length-2] : null;

  const cur3 = last(data.raw3), curM = last(data.rawM);
  const curSig3 = last(data.sig3), curSigM = last(data.sigM);
  const curTrend3 = last(data.trend3), curTrendM = last(data.trendM);
  const prevTrend3 = data.trend3.length>TREND_BARS ? data.trend3[data.trend3.length-1-TREND_BARS] : null;
  const prevTrendM = data.trendM.length>TREND_BARS ? data.trendM[data.trendM.length-1-TREND_BARS] : null;
  const tide3up = curTrend3!==null && prevTrend3!==null && curTrend3>prevTrend3;
  const tideMup = curTrendM!==null && prevTrendM!==null && curTrendM>prevTrendM;
  const aboveSig3 = cur3!==null && curSig3!==null && cur3>curSig3;
  const aboveSigM = curM!==null && curSigM!==null && curM>curSigM;

  const tfLabel3 = srcType === 'weekly' ? '3-Week' : '3-Day';
  const [ar3, ar3c] = trendArrow(cur3, prev(data.raw3));
  const [arM, arMc] = trendArrow(curM, prev(data.rawM));

  return `
    <table class="info-table">
      <tr><th>TF</th><th>DSS</th><th>Signal</th><th>Tide</th><th>Zone</th></tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS['3D']}">3-Day</td>
        <td class="${zoneBgClass(cur3)}">${fv(cur3)}</td>
        <td style="color:${aboveSig3?'#00E676':'#FF1744'}">${aboveSig3?'▲ above':'▼ below'}</td>
        <td class="${tide3up?'trend-up':'trend-down'}">${tide3up?'▲ RISING':'▼ FALLING'}</td>
        <td class="${zoneLabelClass(cur3)}" style="font-weight:700;font-size:0.7rem">${zoneLabel(cur3)}</td>
      </tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS.M}">Monthly</td>
        <td class="${zoneBgClass(curM)}">${fv(curM)}</td>
        <td style="color:${aboveSigM?'#00E676':'#FF1744'}">${aboveSigM?'▲ above':'▼ below'}</td>
        <td class="${tideMup?'trend-up':'trend-down'}">${tideMup?'▲ RISING':'▼ FALLING'}</td>
        <td class="${zoneLabelClass(curM)}" style="font-weight:700;font-size:0.7rem">${zoneLabel(curM)}</td>
      </tr>
    </table>
    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS['3D']}">3-Day</span>
        <span>DSS(13,8) + Signal(5) + Tide(30)</span>
        <span class="data-src">${data.s3.length} bars${srcType==='weekly'?' (interpolated)':''}</span>
      </div>
      <div class="chart-wrap tall"><canvas id="${prefix}-3d"></canvas></div>
    </div>
    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS.M}">Monthly</span>
        <span>DSS(13,8) + Signal(5) + Tide(30)</span>
        <span class="data-src">${data.sM.length} bars</span>
      </div>
      <div class="chart-wrap tall"><canvas id="${prefix}-m"></canvas></div>
    </div>
  `;
}

function renderCharts(data) {
  drawComposite('nl-3d', data.raw3, data.sig3, data.trend3, data.d3, 3000);
  setupTT('nl-3d');
  drawComposite('nl-m', data.rawM, data.sigM, data.trendM, data.dM, 500);
  setupTT('nl-m');
  // Scroll to right (most recent)
  document.querySelectorAll('.chart-wrap').forEach(w => w.scrollLeft = w.scrollWidth);
}

// ─── Main ───
async function init() {
  const el = document.getElementById('content');

  let netSeries = [], tgaSeries = [];
  try {
    const data = await fetch('macro-data.json?t='+Date.now()).then(r=>r.json());
    netSeries = data.netLiq || [];
    tgaSeries = data.tga || [];
  } catch(e) {
    el.innerHTML = '<div class="loading">Failed to load macro-data.json</div>';
    return;
  }

  if (netSeries.length < 30) {
    el.innerHTML = '<div class="loading">Insufficient data.</div>';
    return;
  }

  const netData = processDSS(netSeries, 'netLiq', 'weekly');
  const tgaData = tgaSeries.length > 30 ? processDSS(tgaSeries, 'balance', 'daily') : null;
  const lastNet = netSeries[netSeries.length - 1];
  const lastTga = tgaSeries.length > 0 ? tgaSeries[tgaSeries.length - 1] : null;

  // Net liquidity info
  const fv = v => v !== null ? v.toFixed(1) : '—';
  const last = a => a[a.length-1];
  const prev = a => a.length>1 ? a[a.length-2] : null;

  const curNet3 = last(netData.raw3), curNetM = last(netData.rawM);
  const sigNet3 = last(netData.sig3), sigNetM = last(netData.sigM);
  const trendNet3 = last(netData.trend3), prevTrendNet3 = netData.trend3.length>TREND_BARS ? netData.trend3[netData.trend3.length-1-TREND_BARS] : null;
  const trendNetM = last(netData.trendM), prevTrendNetM = netData.trendM.length>TREND_BARS ? netData.trendM[netData.trendM.length-1-TREND_BARS] : null;
  const tide3up = trendNet3!==null && prevTrendNet3!==null && trendNet3>prevTrendNet3;
  const tideMup = trendNetM!==null && prevTrendNetM!==null && trendNetM>prevTrendNetM;
  const aboveSig3 = curNet3!==null && sigNet3!==null && curNet3>sigNet3;
  const aboveSigM = curNetM!==null && sigNetM!==null && curNetM>sigNetM;

  // TGA info
  let tgaRow = '', tgaChart = '';
  if (tgaData) {
    const curTga3 = last(tgaData.raw3), sigTga3 = last(tgaData.sig3);
    const trendTga3 = last(tgaData.trend3), prevTrendTga3 = tgaData.trend3.length>TREND_BARS ? tgaData.trend3[tgaData.trend3.length-1-TREND_BARS] : null;
    const tideTga3up = trendTga3!==null && prevTrendTga3!==null && trendTga3>prevTrendTga3;
    const aboveSigTga3 = curTga3!==null && sigTga3!==null && curTga3>sigTga3;
    tgaRow = `<tr>
      <td class="tf-label" style="color:#e8a04c">TGA 3-Day</td>
      <td class="${zoneBgClass(curTga3)}">${fv(curTga3)}</td>
      <td style="color:${aboveSigTga3?'#00E676':'#FF1744'}">${aboveSigTga3?'▲ above':'▼ below'}</td>
      <td class="${tideTga3up?'trend-up':'trend-down'}">${tideTga3up?'▲ RISING':'▼ FALLING'}</td>
      <td class="${zoneLabelClass(curTga3)}" style="font-weight:700;font-size:0.7rem">${zoneLabel(curTga3)}</td>
    </tr>`;
    tgaChart = `<div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:#e8a04c">TGA 3-Day</span>
        <span>DSS(13,8) + Signal(5) + Tide(30)</span>
        <span class="data-src">${tgaData.s3.length} bars</span>
      </div>
      <div class="chart-wrap tall"><canvas id="tga-3d"></canvas></div>
    </div>`;
  }

  el.innerHTML = `
    <div class="section-header">
      <span class="val" style="color:#FF9800">$${(lastNet.netLiq/1e6).toFixed(2)}T</span>
      <span class="date">As of ${lastNet.date}</span>
      ${lastTga ? '<span style="color:#e8a04c;font-size:0.85rem;margin-left:12px">TGA $'+(lastTga.balance/1e3).toFixed(1)+'B</span>' : ''}
    </div>
    <table class="info-table">
      <tr><th>TF</th><th>DSS</th><th>Signal</th><th>Tide</th><th>Zone</th></tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS['3D']}">Net Liq 3-Day</td>
        <td class="${zoneBgClass(curNet3)}">${fv(curNet3)}</td>
        <td style="color:${aboveSig3?'#00E676':'#FF1744'}">${aboveSig3?'▲ above':'▼ below'}</td>
        <td class="${tide3up?'trend-up':'trend-down'}">${tide3up?'▲ RISING':'▼ FALLING'}</td>
        <td class="${zoneLabelClass(curNet3)}" style="font-weight:700;font-size:0.7rem">${zoneLabel(curNet3)}</td>
      </tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS.M}">Net Liq Monthly</td>
        <td class="${zoneBgClass(curNetM)}">${fv(curNetM)}</td>
        <td style="color:${aboveSigM?'#00E676':'#FF1744'}">${aboveSigM?'▲ above':'▼ below'}</td>
        <td class="${tideMup?'trend-up':'trend-down'}">${tideMup?'▲ RISING':'▼ FALLING'}</td>
        <td class="${zoneLabelClass(curNetM)}" style="font-weight:700;font-size:0.7rem">${zoneLabel(curNetM)}</td>
      </tr>
      ${tgaRow}
    </table>
    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS['3D']}">Net Liquidity 3-Day</span>
        <span>DSS(13,8) + Signal(5) + Tide(30)</span>
        <span class="data-src">${netData.s3.length} bars (interpolated)</span>
      </div>
      <div class="chart-wrap tall"><canvas id="nl-3d"></canvas></div>
    </div>
    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS.M}">Net Liquidity Monthly</span>
        <span>DSS(13,8) + Signal(5) + Tide(30)</span>
        <span class="data-src">${netData.sM.length} bars</span>
      </div>
      <div class="chart-wrap tall"><canvas id="nl-m"></canvas></div>
    </div>
    ${tgaChart}
  `;

  requestAnimationFrame(() => {
    renderCharts(netData);
    if (tgaData) {
      drawComposite('tga-3d', tgaData.raw3, tgaData.sig3, tgaData.trend3, tgaData.d3, 500);
      setupTT('tga-3d');
    }
    document.querySelectorAll('.chart-wrap').forEach(w => w.scrollLeft = w.scrollWidth);
  });
}

init();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const active = document.querySelector('.tab-content.active');
    if (active && window._tabData) {
      const id = active.id.replace('tab-','');
      renderCharts(id, window._tabData[id]);
    }
  }, 200);
});
</script>
</body>
</html>
