<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGA DSS Oscillator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0F0F1A;
  color: #d4c9b8;
  font-family: 'Space Mono', monospace;
  padding: 20px;
  min-height: 100vh;
}
h1 {
  font-size: 1.4rem;
  color: #e8dcc8;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.75rem;
  color: #888;
  margin-bottom: 24px;
}

/* Info table — matches Pine top-right table */
.info-table {
  border-collapse: collapse;
  margin-bottom: 20px;
  font-size: 0.8rem;
}
.info-table th {
  color: #888;
  font-weight: 400;
  padding: 4px 12px;
  text-align: center;
  background: #0F0F1A;
  border: 1px solid #444;
}
.info-table td {
  padding: 5px 12px;
  text-align: center;
  border: 1px solid #444;
  background: #1A1A2E;
}
.info-table .tf-label { font-weight: 700; }
.info-table .zone-cell { font-weight: 700; font-size: 0.75rem; }

/* Zone value backgrounds (match Pine zoneBg) */
.zb-ob   { background: rgba(255,23,68,0.4) !important; color: #fff; }
.zb-high { background: rgba(255,152,0,0.25) !important; color: #fff; }
.zb-os   { background: rgba(0,230,118,0.4) !important; color: #fff; }
.zb-low  { background: rgba(0,188,212,0.25) !important; color: #fff; }
.zb-mid  { background: rgba(51,51,51,0.5) !important; color: #fff; }

/* Zone label colors */
.zc-ob  { color: #FF1744; }
.zc-os  { color: #00E676; }
.zc-mid { color: #888; }

/* Trend arrows */
.trend-up   { color: #00E676; font-weight: 700; }
.trend-down { color: #FF1744; font-weight: 700; }

/* Chart area */
.chart-section {
  background: #1A1A2E;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 20px;
}
.chart-header {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.chart-header .tf { font-weight: 700; }
.chart-wrap {
  position: relative;
  height: 220px;
}
.chart-wrap canvas {
  width: 100%;
  height: 100%;
}

/* Legend */
.legend {
  display: flex;
  gap: 20px;
  margin-top: 8px;
  font-size: 0.7rem;
  color: #888;
}
.legend-dot {
  display: inline-block;
  width: 10px;
  height: 3px;
  border-radius: 2px;
  margin-right: 4px;
  vertical-align: middle;
}

/* Balance header */
.balance-bar {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.balance-big {
  font-size: 1.6rem;
  font-weight: 700;
  color: #e8dcc8;
}
.balance-date {
  font-size: 0.75rem;
  color: #666;
}
.balance-note {
  font-size: 0.7rem;
  color: #666;
  font-style: italic;
}

.loading {
  color: #666;
  font-size: 0.85rem;
  padding: 40px;
  text-align: center;
}
</style>
</head>
<body>

<h1>TGA DSS Bressert</h1>
<p class="subtitle">Double Smoothed Stochastic on Treasury General Account — Daily, 3-Day, Weekly</p>

<div id="content">
  <div class="loading">Fetching TGA data...</div>
</div>

<script>
const LIQ_API = 'https://script.google.com/macros/s/AKfycbyeL8nGHmsRRG2uk7I3cuh2aWQ14RRKvJYwOblvOWw36_QIKyr9KaA4jXK1K5pyySNiBg/exec?action=liquidity';

// ─── DSS Bressert (matches Pine exactly) ───
// 1. Raw stochastic on source
// 2. EMA smooth → smooth1
// 3. Raw stochastic on smooth1
// 4. EMA smooth → dssLine
function calcDSS(values, stochLen, smoothLen) {
  const len = values.length;

  // Step 1: raw stochastic
  const rawK = [];
  for (let i = 0; i < len; i++) {
    if (i < stochLen - 1) { rawK.push(null); continue; }
    let hi = -Infinity, lo = Infinity;
    for (let j = i - stochLen + 1; j <= i; j++) {
      if (values[j] > hi) hi = values[j];
      if (values[j] < lo) lo = values[j];
    }
    const r = hi - lo;
    rawK.push(r === 0 ? 50 : ((values[i] - lo) / r) * 100);
  }

  // Step 2: EMA of rawK
  const smooth1 = ema(rawK, smoothLen);

  // Step 3: stochastic of smooth1
  const rawK2 = [];
  for (let i = 0; i < len; i++) {
    if (smooth1[i] === null || i < stochLen - 1) { rawK2.push(null); continue; }
    let hi = -Infinity, lo = Infinity, ok = true;
    for (let j = i - stochLen + 1; j <= i; j++) {
      if (smooth1[j] === null) { ok = false; break; }
      if (smooth1[j] > hi) hi = smooth1[j];
      if (smooth1[j] < lo) lo = smooth1[j];
    }
    if (!ok) { rawK2.push(null); continue; }
    const r = hi - lo;
    rawK2.push(r === 0 ? 50 : ((smooth1[i] - lo) / r) * 100);
  }

  // Step 4: EMA of rawK2 = final DSS line
  return ema(rawK2, smoothLen);
}

function ema(arr, period) {
  const out = [];
  const k = 2 / (period + 1);
  let prev = null;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === null) { out.push(null); continue; }
    prev = prev === null ? arr[i] : arr[i] * k + prev * (1 - k);
    out.push(prev);
  }
  return out;
}

// ─── Resample to N-day bars ───
function resample(series, days) {
  if (days <= 1) return series;
  const bars = [];
  for (let i = 0; i < series.length; i += days) {
    const chunk = series.slice(i, i + days);
    bars.push(chunk[chunk.length - 1]);
  }
  return bars;
}

// ─── Apply chase smoothing (matches Pine smoothSpeed) ───
function chaseSmooth(raw, speed) {
  const out = [];
  let sm = null;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i] === null) { out.push(null); continue; }
    if (sm === null) sm = raw[i];
    else sm += (raw[i] - sm) * speed;
    out.push(sm);
  }
  return out;
}

// ─── Zone helpers (match Pine) ───
const OB = 80, OS = 20;

function zoneLabel(v) {
  if (v === null) return '—';
  if (v > OB) return 'OB';
  if (v < OS) return 'OS';
  if (v > 65) return 'HIGH';
  if (v < 35) return 'LOW';
  return '—';
}

function zoneLabelClass(v) {
  if (v === null) return 'zc-mid';
  if (v > OB) return 'zc-ob';
  if (v < OS) return 'zc-os';
  return 'zc-mid';
}

function zoneBgClass(v) {
  if (v === null) return 'zb-mid';
  if (v > OB) return 'zb-ob';
  if (v > 65) return 'zb-high';
  if (v < OS) return 'zb-os';
  if (v < 35) return 'zb-low';
  return 'zb-mid';
}

function trendArrow(cur, prev) {
  if (cur === null || prev === null) return ['—', 'zc-mid'];
  return cur > prev
    ? [' ▲', 'trend-up']
    : [' ▼', 'trend-down'];
}

// ─── TF colors (match Pine) ───
const TF_COLORS = {
  'D':  '#00BCD4',
  '3D': '#FF9800',  // Pine uses black but invisible on dark bg
  'W':  '#BB86FC'
};

// ─── Draw chart ───
function drawChart(canvasId, dssVals, dates, tfKey, maxPts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 10, right: 45, bottom: 22, left: 38 };
  const pw = w - pad.left - pad.right;
  const ph = h - pad.top - pad.bottom;

  // Collect valid points
  const pts = [];
  for (let i = 0; i < dssVals.length; i++) {
    if (dssVals[i] !== null) pts.push({ v: dssVals[i], d: dates[i] });
  }
  if (pts.length < 2) return;
  const display = pts.slice(-maxPts);

  const toX = i => pad.left + (i / (display.length - 1)) * pw;
  const toY = v => pad.top + ph * (1 - Math.max(0, Math.min(100, v)) / 100);

  ctx.clearRect(0, 0, w, h);

  // OB/OS zone fills
  ctx.fillStyle = 'rgba(255,23,68,0.08)';
  ctx.fillRect(pad.left, toY(100), pw, toY(OB) - toY(100));
  ctx.fillStyle = 'rgba(0,230,118,0.08)';
  ctx.fillRect(pad.left, toY(OS), pw, toY(0) - toY(OS));

  // Grid lines
  [0, OS, 50, OB, 100].forEach(lv => {
    const y = toY(lv);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    if (lv === OB) {
      ctx.strokeStyle = 'rgba(255,23,68,0.35)';
      ctx.setLineDash([5, 4]);
    } else if (lv === OS) {
      ctx.strokeStyle = 'rgba(0,230,118,0.35)';
      ctx.setLineDash([5, 4]);
    } else if (lv === 50) {
      ctx.strokeStyle = 'rgba(102,102,102,0.4)';
      ctx.setLineDash([3, 5]);
    } else {
      ctx.strokeStyle = 'rgba(68,68,68,0.25)';
      ctx.setLineDash([]);
    }
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.setLineDash([]);
    // Label
    ctx.fillStyle = '#666';
    ctx.font = '9px "Space Mono", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(lv, pad.left - 5, y + 3);
  });

  // Date labels
  ctx.fillStyle = '#555';
  ctx.font = '8px "Space Mono", monospace';
  ctx.textAlign = 'center';
  const nLabels = Math.min(5, display.length);
  for (let i = 0; i < nLabels; i++) {
    const idx = Math.floor(i * (display.length - 1) / (nLabels - 1));
    const d = display[idx].d;
    if (d) {
      const p = d.split('-');
      ctx.fillText(p[1] + '-' + p[2], toX(idx), h - 4);
    }
  }

  // DSS line
  const lineColor = TF_COLORS[tfKey] || '#00BCD4';
  ctx.beginPath();
  for (let i = 0; i < display.length; i++) {
    const x = toX(i), y = toY(display[i].v);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = tfKey === 'D' ? 3 : 2;
  ctx.stroke();

  // Gradient fill under line
  ctx.beginPath();
  for (let i = 0; i < display.length; i++) {
    const x = toX(i), y = toY(display[i].v);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.lineTo(toX(display.length - 1), h - pad.bottom);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  grad.addColorStop(0, lineColor + '18');
  grad.addColorStop(1, lineColor + '03');
  ctx.fillStyle = grad;
  ctx.fill();

  // End dot
  const last = display[display.length - 1];
  ctx.beginPath();
  ctx.arc(toX(display.length - 1), toY(last.v), 4, 0, Math.PI * 2);
  ctx.fillStyle = lineColor;
  ctx.fill();

  // Value label at end
  ctx.fillStyle = '#e8dcc8';
  ctx.font = '10px "Space Mono", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(last.v.toFixed(1), w - pad.right + 6, toY(last.v) + 4);
}

// ─── Main ───
async function init() {
  let data;
  try {
    const resp = await fetch(LIQ_API + '&t=' + Date.now());
    data = await resp.json();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">Failed to fetch TGA data.</div>';
    return;
  }

  if (!data || data.status !== 'ok' || !data.series || data.series.length < 30) {
    document.getElementById('content').innerHTML =
      '<div class="loading">Insufficient TGA data.</div>';
    return;
  }

  const series = data.series;
  const m = data.metrics;

  // Daily
  const dVals = series.map(d => d.balance);
  const dDates = series.map(d => d.date);
  const dssD = calcDSS(dVals, 13, 8);

  // 3-Day
  const s3 = resample(series, 3);
  const dss3raw = calcDSS(s3.map(d => d.balance), 13, 8);
  const dss3 = chaseSmooth(dss3raw, 0.15);
  const dates3 = s3.map(d => d.date);

  // Weekly
  const sW = resample(series, 5);
  const dssWraw = calcDSS(sW.map(d => d.balance), 13, 8);
  const dssW = chaseSmooth(dssWraw, 0.15);
  const datesW = sW.map(d => d.date);

  // Current values
  const curD = dssD[dssD.length - 1];
  const prevD = dssD.length > 1 ? dssD[dssD.length - 2] : null;
  const cur3 = dss3[dss3.length - 1];
  const prev3 = dss3.length > 1 ? dss3[dss3.length - 2] : null;
  const curW = dssW[dssW.length - 1];
  const prevW = dssW.length > 1 ? dssW[dssW.length - 2] : null;

  const [arD, arDc] = trendArrow(curD, prevD);
  const [ar3, ar3c] = trendArrow(cur3, prev3);
  const [arW, arWc] = trendArrow(curW, prevW);

  const fv = v => v !== null ? v.toFixed(1) : '—';

  document.getElementById('content').innerHTML = `
    <div class="balance-bar">
      <span class="balance-big">${m ? m.currentBalanceFormatted : '--'}</span>
      <span class="balance-date">${m ? 'As of ' + m.currentDate : ''}</span>
      <span class="balance-note">DSS inverted: OB = Treasury hoarding = bearish | OS = Treasury spending = bullish</span>
    </div>

    <table class="info-table">
      <tr>
        <th>DSS</th><th>Value</th><th>Trend</th><th>Zone</th>
      </tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS['D']}">D ★</td>
        <td class="${zoneBgClass(curD)}">${fv(curD)}</td>
        <td class="${arDc}">${arD}</td>
        <td class="zone-cell ${zoneLabelClass(curD)}">${zoneLabel(curD)}</td>
      </tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS['3D']}">3D</td>
        <td class="${zoneBgClass(cur3)}">${fv(cur3)}</td>
        <td class="${ar3c}">${ar3}</td>
        <td class="zone-cell ${zoneLabelClass(cur3)}">${zoneLabel(cur3)}</td>
      </tr>
      <tr>
        <td class="tf-label" style="color:${TF_COLORS['W']}">W</td>
        <td class="${zoneBgClass(curW)}">${fv(curW)}</td>
        <td class="${arWc}">${arW}</td>
        <td class="zone-cell ${zoneLabelClass(curW)}">${zoneLabel(curW)}</td>
      </tr>
    </table>

    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS['D']}">Daily</span>
        <span>DSS(13,8)</span>
      </div>
      <div class="chart-wrap"><canvas id="c-d"></canvas></div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS['3D']}">3-Day</span>
        <span>DSS(13,8) smoothed</span>
      </div>
      <div class="chart-wrap"><canvas id="c-3d"></canvas></div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <span class="tf" style="color:${TF_COLORS['W']}">Weekly</span>
        <span>DSS(13,8) smoothed</span>
      </div>
      <div class="chart-wrap"><canvas id="c-w"></canvas></div>
    </div>
  `;

  requestAnimationFrame(() => {
    drawChart('c-d', dssD, dDates, 'D', 120);
    drawChart('c-3d', dss3, dates3, '3D', 90);
    drawChart('c-w', dssW, datesW, 'W', 52);
  });
}

init();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(init, 200);
});
</script>
</body>
</html>
